version: 4
modelgroups:
  polytoken:default_model_full: zai/glm-5.3(high)
  polytoken:default_model_mini: codex/gpt-6-luna-1m(high)
  polytoken:execute: zai/glm-5.3-flash
  polytoken:plan_reviewer:
  - codex/gpt-6-astra-1m(low)
  - codex/gpt-6-sol-1m(medium)
  - zai/glm-5.3(max)
providers:
  codex:
    kind:
      type: catalog
      name: codex
    auth:
      type: codex_device
      profile: codex
  deepinfra:
    kind:
      type: catalog
      name: deepinfra
    auth:
      type: static_key
      key: ${DEEPINFRA_API_KEY}
  google-ai:
    kind:
      type: catalog
      name: google-ai
    auth:
      type: static_key
      key: ${GEMINI_API_KEY}
  zai:
    kind:
      type: catalog
      name: zai
    auth:
      type: static_key
      key: ${ZAI_API_KEY}
  xiaomi:
    kind:
      type: catalog
      name: xiaomi
    auth:
      type: static_key
      key: ${MIMO_API_KEY}
  umans:
    kind:
      type: catalog
      name: umans
    auth:
      type: static_key
      key: ${UMANS_API_KEY}
active_session:
  default_facet: plan
default_permission_matcher: bypass_plus
autonomous_permission_matcher:
  max_consecutive_denials: 3
daemon:
  log_level: debug
  goal_driver:
    plan_handoff_activate_goal: false
    agent_goal_auto_accept: false
    max_continuations_per_goal: 50
integrations:
  search:
    providers:
      brave:
        enabled: true
        key: ${BRAVE_SEARCH_API_KEY}
      tavily:
        enabled: true
        key: ${TAVILY_API_KEY}
      exa:
        enabled: true
        key: ${EXA_API_KEY}
      kagi:
        enabled: false
        key: ''
      parallel:
        enabled: true
        key: ${PARALLEL_API_KEY}
      you:
        enabled: true
        key: ${YOU_API_KEY}
tui:
  theme: dark
  theme-file: polytoken://themes/boringcyberpunk.yaml
  alt-screen: auto
  confirm-quit: false
  density: standard
  show-all-thinking-blocks: false
  show-system-reminders: true
  sidebar:
    side: right
    default-state: open
    collapse-threshold: 100
    width: 40
telemetry:
  protocol: http/protobuf
  endpoint: https://api.honeycomb.io
  headers:
    x-honeycomb-team: {{ onepasswordRead "op://Local Dev/Honeycomb/x-honeycomb-team" | quote }}
  service_name: polytoken
